stages:
  - build
  - bump
  - publish

build:
  stage: build
  image: node:20
  script:
    - yarn install --frozen-lockfile
    - mkdir -p app/assets/builds
    - yarn build
  artifacts:
    paths:
      - app/assets/builds/
    expire_in: 1h

bump-version:
  stage: bump
  image: ruby:3.3
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
  script:
    - |
      set -e
      VERSION=$(ruby -e "require_relative 'lib/profiler/version'; puts Profiler::VERSION")
      if ! git ls-remote --tags origin | grep -q "refs/tags/v${VERSION}$"; then
        echo "Version already bumped to ${VERSION}, skipping."
        exit 0
      fi
      MAJOR=$(echo "$VERSION" | cut -d. -f1)
      MINOR=$(echo "$VERSION" | cut -d. -f2)
      PATCH=$(echo "$VERSION" | cut -d. -f3)
      if echo "$CI_MERGE_REQUEST_SOURCE_BRANCH_NAME" | grep -q "^breaking/"; then
        NEW_VERSION="$((MAJOR + 1)).0.0"
      elif echo "$CI_MERGE_REQUEST_SOURCE_BRANCH_NAME" | grep -q "^feature/"; then
        NEW_VERSION="${MAJOR}.$((MINOR + 1)).0"
      else
        NEW_VERSION="${MAJOR}.${MINOR}.$((PATCH + 1))"
      fi
      sed -i "s/VERSION = .*/VERSION = \"${NEW_VERSION}\"/" lib/profiler/version.rb
      git config user.email "ci@gitlab"
      git config user.name "GitLab CI"
      git remote set-url origin "https://ci:${GITLAB_TOKEN}@${CI_SERVER_HOST}/${CI_PROJECT_PATH}.git"
      git add lib/profiler/version.rb
      git commit -m "chore(release): bump version to v${NEW_VERSION}"
      git push origin "HEAD:${CI_MERGE_REQUEST_SOURCE_BRANCH_NAME}"

canary:
  stage: publish
  image: ruby:3.3
  needs: [build]
  rules:
    - if: '$CI_COMMIT_BRANCH =~ /^(feature|fix|breaking)\// && $CI_PIPELINE_SOURCE != "merge_request_event"'
  script:
    - CURRENT_VERSION=$(ruby -e "require_relative 'lib/profiler/version'; puts Profiler::VERSION")
    - CANARY_VERSION="${CURRENT_VERSION}.pre.${CI_COMMIT_SHORT_SHA}"
    - sed -i "s/VERSION = .*/VERSION = \"${CANARY_VERSION}\"/" lib/profiler/version.rb
    - gem build profiler.gemspec
    - 'mkdir -p ~/.gem && printf -- "---\n:gitlab: ${CI_JOB_TOKEN}\n" > ~/.gem/credentials && chmod 0600 ~/.gem/credentials'
    - gem push *.gem --key gitlab --host "${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/packages/rubygems" --verbose

release:
  stage: publish
  image: ruby:3.3
  needs: [build]
  rules:
    - if: '$CI_COMMIT_BRANCH == "master" && $CI_COMMIT_TAG == null'
  script:
    - VERSION=$(ruby -e "require_relative 'lib/profiler/version'; puts Profiler::VERSION")
    - |
      if git ls-remote --tags origin | grep -q "refs/tags/v${VERSION}$"; then
        echo "Error: tag v${VERSION} already exists. Version was not bumped before merge."
        exit 1
      fi
    - gem build profiler.gemspec
    - 'mkdir -p ~/.gem && printf -- "---\n:gitlab: ${CI_JOB_TOKEN}\n" > ~/.gem/credentials && chmod 0600 ~/.gem/credentials'
    - gem push *.gem --key gitlab --host "${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/packages/rubygems" --verbose
    - git config user.email "ci@gitlab"
    - git config user.name "GitLab CI"
    - git remote set-url origin "https://ci:${GITLAB_TOKEN}@${CI_SERVER_HOST}/${CI_PROJECT_PATH}.git"
    - git tag "v${VERSION}"
    - git push origin "v${VERSION}"
