stages:
  - build
  - publish

build:
  stage: build
  image: node:20
  script:
    - yarn install --frozen-lockfile
    - mkdir -p app/assets/builds
    - yarn build
  artifacts:
    paths:
      - app/assets/builds/
    expire_in: 1h

canary:
  stage: publish
  image: ruby:3.3
  needs: [build]
  variables:
    GIT_DEPTH: "0"
  rules:
    - if: '$CI_COMMIT_BRANCH =~ /^(feature|fix|breaking)\// && $CI_PIPELINE_SOURCE != "merge_request_event"'
  script:
    - |
      set -e
      LAST_TAG=$(git describe --tags --abbrev=0 2>/dev/null || echo "")
      if [ -n "$LAST_TAG" ]; then
        BASE_VERSION="${LAST_TAG#v}"
      else
        BASE_VERSION=$(ruby -e "require_relative 'lib/profiler/version'; puts Profiler::VERSION")
      fi
      CANARY_VERSION="${BASE_VERSION}.pre.${CI_COMMIT_SHORT_SHA}"
      sed -i "s/VERSION = .*/VERSION = \"${CANARY_VERSION}\"/" lib/profiler/version.rb
      gem build profiler.gemspec
      mkdir -p ~/.gem && printf -- "---\n:gitlab: ${CI_JOB_TOKEN}\n" > ~/.gem/credentials && chmod 0600 ~/.gem/credentials
      gem push *.gem --key gitlab --host "${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/packages/rubygems" --verbose

release:
  stage: publish
  image: ruby:3.3
  needs: [build]
  variables:
    GIT_DEPTH: "0"
  rules:
    - if: '$CI_COMMIT_BRANCH == "master" && $CI_COMMIT_TAG == null'
  script:
    - |
      set -e
      LAST_TAG=$(git describe --tags --abbrev=0 2>/dev/null || echo "")
      if [ -z "$LAST_TAG" ]; then
        BASE_VERSION="0.0.0"
        COMMITS=$(git log --format="%s%n%b")
      else
        BASE_VERSION="${LAST_TAG#v}"
        COMMITS=$(git log "${LAST_TAG}..HEAD" --format="%s%n%b")
      fi

      if [ -z "$COMMITS" ]; then
        echo "No commits since last tag, skipping."
        exit 0
      fi

      MAJOR=$(echo "$BASE_VERSION" | cut -d. -f1)
      MINOR=$(echo "$BASE_VERSION" | cut -d. -f2)
      PATCH=$(echo "$BASE_VERSION" | cut -d. -f3)

      if echo "$COMMITS" | grep -qE "^BREAKING CHANGE:|^[a-z]+(\(.+\))?!:"; then
        NEW_VERSION="$((MAJOR + 1)).0.0"
      elif echo "$COMMITS" | grep -qE "^feat(\(.+\))?:"; then
        NEW_VERSION="${MAJOR}.$((MINOR + 1)).0"
      else
        NEW_VERSION="${MAJOR}.${MINOR}.$((PATCH + 1))"
      fi

      if git ls-remote --tags origin | grep -q "refs/tags/v${NEW_VERSION}$"; then
        echo "Tag v${NEW_VERSION} already exists, skipping."
        exit 0
      fi

      [[ -n "$RUBYGEMS_API_KEY" ]] || (echo "Error: RUBYGEMS_API_KEY is not set" && exit 1)
      sed -i "s/VERSION = .*/VERSION = \"${NEW_VERSION}\"/" lib/profiler/version.rb
      gem build profiler.gemspec
      mkdir -p ~/.gem && printf -- "---\n:gitlab: ${CI_JOB_TOKEN}\n" > ~/.gem/credentials && chmod 0600 ~/.gem/credentials
      gem push *.gem --key gitlab --host "${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/packages/rubygems" --verbose
      GEM_HOST_API_KEY="${RUBYGEMS_API_KEY}" gem push *.gem --host https://rubygems.org --verbose
      git config user.email "ci@gitlab"
      git config user.name "GitLab CI"
      git remote set-url origin "https://gitlab-ci-token:${CI_JOB_TOKEN}@${CI_SERVER_HOST}/${CI_PROJECT_PATH}.git"
      git tag "v${NEW_VERSION}"
      git push origin "v${NEW_VERSION}"
      echo "Released v${NEW_VERSION}."
