stages:
  - test
  - build
  - publish

rspec:
  stage: test
  image: ruby:3.3
  script:
    - bundle install
    - bundle exec rspec
  cache:
    key: gem-bundle-$CI_COMMIT_REF_SLUG
    paths:
      - vendor/bundle
  before_script:
    - bundle config set --local path vendor/bundle

# The same suite on the next Ruby, not a nicety: from 3.4 on, the standard library
# itself calls Thread.new with arguments, in the Happy Eyeballs hostname resolution
# of Socket.tcp, and the gem prepends a module to Thread#initialize. A breakage
# there is invisible on 3.3. Its own cache key, since the bundle is per Ruby ABI.
rspec:ruby3.4:
  stage: test
  image: ruby:3.4
  script:
    - bundle install
    - bundle exec rspec
  cache:
    key: gem-bundle-ruby3.4-$CI_COMMIT_REF_SLUG
    paths:
      - vendor/bundle
  before_script:
    - bundle config set --local path vendor/bundle

# Runs in the ordinary branch pipeline, next to rspec, on every branch that is not
# the default one. No prefix allowlist: feat/, refactor/, docs/ and chore/ branches
# have already been merged here, and a prefix list silently exempts whatever it
# forgot. Deliberately NOT a merge_request_event job: a job limited to
# merge_request_event would create a merge request pipeline containing only itself,
# which would show up green on the MR while rspec (a branch pipeline job) could be red.
changelog:check:
  stage: test
  image: ruby:3.3
  variables:
    GIT_DEPTH: "0"
  rules:
    - if: '$CI_COMMIT_BRANCH && $CI_COMMIT_BRANCH != $CI_DEFAULT_BRANCH && $CI_PIPELINE_SOURCE != "merge_request_event"'
  script:
    # A branch pipeline does not bring master along, even with GIT_DEPTH: "0".
    - git fetch origin "+refs/heads/master:refs/remotes/origin/master"
    - ruby bin/changelog check --base origin/master
    # Needs every tag and the whole history, hence GIT_DEPTH: "0" above. It is
    # deliberately not in the release job: an editorial gap must not stop a
    # publication.
    - ruby bin/changelog coverage

build:
  stage: build
  image: node:22
  script:
    - yarn install --frozen-lockfile
    - mkdir -p app/assets/builds
    - yarn build:full
  artifacts:
    paths:
      - app/assets/builds/
    # Long enough that re-running a release job days later still finds them:
    # the release refuses to build a gem without compiled assets.
    expire_in: 1 week

canary:
  stage: publish
  image: ruby:3.3
  needs: [build]
  variables:
    GIT_DEPTH: "0"
  rules:
    - if: '$CI_COMMIT_BRANCH =~ /^(feature|bugfix|hotfix|fix|breaking)\// && $CI_PIPELINE_SOURCE != "merge_request_event"'
  script:
    - |
      set -e
      LAST_TAG=$(git describe --tags --abbrev=0 2>/dev/null || echo "")
      if [ -n "$LAST_TAG" ]; then
        BASE_VERSION="${LAST_TAG#v}"
      else
        BASE_VERSION=$(ruby -e "require_relative 'lib/profiler/version'; puts Profiler::VERSION")
      fi
      CANARY_VERSION="${BASE_VERSION}.pre.${CI_COMMIT_SHORT_SHA}"
      sed -i "s/VERSION = .*/VERSION = \"${CANARY_VERSION}\"/" lib/profiler/version.rb
      gem build profiler.gemspec
      mkdir -p ~/.gem && printf -- "---\n:gitlab: ${CI_JOB_TOKEN}\n" > ~/.gem/credentials && chmod 0600 ~/.gem/credentials
      gem push *.gem --key gitlab --host "${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/packages/rubygems" --verbose

release:
  stage: publish
  image: ruby:3.3
  needs: [build]
  # One release at a time: the job tags the merged commit and pushes that tag.
  resource_group: release
  variables:
    GIT_DEPTH: "0"
  rules:
    - if: '$CI_COMMIT_BRANCH == "master" && $CI_COMMIT_TAG == null'
  script:
    - bash script/release.sh
