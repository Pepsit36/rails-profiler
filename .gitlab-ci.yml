stages:
  - build
  - publish

build:
  stage: build
  image: node:20
  script:
    - yarn install --frozen-lockfile
    - mkdir -p app/assets/builds
    - yarn build
  artifacts:
    paths:
      - app/assets/builds/
    expire_in: 1h

canary:
  stage: publish
  image: ruby:3.3
  needs: [build]
  rules:
    - if: $CI_COMMIT_BRANCH =~ /^(feature|fix|breaking)\//
  script:
    - CURRENT_VERSION=$(ruby -e "require_relative 'lib/profiler/version'; puts Profiler::VERSION")
    - CANARY_VERSION="${CURRENT_VERSION}.pre.${CI_COMMIT_SHORT_SHA}"
    - sed -i "s/VERSION = .*/VERSION = \"${CANARY_VERSION}\"/" lib/profiler/version.rb
    - gem build profiler.gemspec
    - 'mkdir -p ~/.gem && printf -- "---\n:gitlab: ${CI_JOB_TOKEN}\n" > ~/.gem/credentials && chmod 0600 ~/.gem/credentials'
    - gem push *.gem --key gitlab --host "${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/packages/rubygems" --verbose

release:
  stage: publish
  image: ruby:3.3
  needs: [build]
  rules:
    - if: $CI_COMMIT_BRANCH == "master"
  script:
    - apt-get update -qq && apt-get install -y curl jq
    - |
      SOURCE_BRANCH=$(curl -s --header "PRIVATE-TOKEN: $GITLAB_TOKEN" \
        "$CI_API_V4_URL/projects/$CI_PROJECT_ID/repository/commits/$CI_COMMIT_SHA/merge_requests" \
        | jq -r '.[0].source_branch // ""')
    - CURRENT_VERSION=$(ruby -e "require_relative 'lib/profiler/version'; puts Profiler::VERSION")
    - MAJOR=$(echo "$CURRENT_VERSION" | cut -d. -f1)
    - MINOR=$(echo "$CURRENT_VERSION" | cut -d. -f2)
    - PATCH=$(echo "$CURRENT_VERSION" | cut -d. -f3)
    - |
      if echo "$SOURCE_BRANCH" | grep -q "^breaking/"; then
        NEW_VERSION="$((MAJOR + 1)).0.0"
      elif echo "$SOURCE_BRANCH" | grep -q "^feature/"; then
        NEW_VERSION="${MAJOR}.$((MINOR + 1)).0"
      else
        NEW_VERSION="${MAJOR}.${MINOR}.$((PATCH + 1))"
      fi
    - sed -i "s/VERSION = .*/VERSION = \"${NEW_VERSION}\"/" lib/profiler/version.rb
    - gem build profiler.gemspec
    - 'mkdir -p ~/.gem && printf -- "---\n:gitlab: ${CI_JOB_TOKEN}\n" > ~/.gem/credentials && chmod 0600 ~/.gem/credentials'
    - gem push *.gem --key gitlab --host "${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/packages/rubygems" --verbose
    - git config user.email "ci@gitlab"
    - git config user.name "GitLab CI"
    - git remote set-url origin "https://ci:${GITLAB_TOKEN}@${CI_SERVER_HOST}/${CI_PROJECT_PATH}.git"
    - git add lib/profiler/version.rb
    - 'git commit -m "chore(release): v${NEW_VERSION}"'
    - git tag "v${NEW_VERSION}"
    - git push origin HEAD:master --tags
