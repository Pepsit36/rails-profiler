stages:
  - test
  - build
  - package
  - publish

rspec:
  stage: test
  image: ruby:3.3
  script:
    - bundle install
    - bundle exec rspec
  cache:
    key: gem-bundle-$CI_COMMIT_REF_SLUG
    paths:
      - vendor/bundle
  before_script:
    - bundle config set --local path vendor/bundle

# The same suite on the next Ruby, not a nicety: from 3.4 on, the standard library
# itself calls Thread.new with arguments, in the Happy Eyeballs hostname resolution
# of Socket.tcp, and the gem prepends a module to Thread#initialize. A breakage
# there is invisible on 3.3. Its own cache key, since the bundle is per Ruby ABI.
rspec:ruby3.4:
  stage: test
  image: ruby:3.4
  script:
    - bundle install
    - bundle exec rspec
  cache:
    key: gem-bundle-ruby3.4-$CI_COMMIT_REF_SLUG
    paths:
      - vendor/bundle
  before_script:
    - bundle config set --local path vendor/bundle

# The oldest Rails and Ruby the gemspec declares (ruby >= 3.0, rails >= 7.1; 7.0 was never
# supported: Rack::Headers is Rack 3 and ActiveSupport::BroadcastLogger is Rails 7.1).
# Still allowed to fail: nobody has seen this combination green yet, the sandbox that
# raised the bound could not build the native extensions. Remove allow_failure after the
# first green run of this job.
rspec:ruby3.1-rails7.1:
  stage: test
  image: ruby:3.1
  allow_failure: true
  variables:
    BUNDLE_GEMFILE: $CI_PROJECT_DIR/gemfiles/rails_7_1.gemfile
  script:
    - bundle install
    - bundle exec rspec
  cache:
    key: gem-bundle-ruby3.1-rails7.1-$CI_COMMIT_REF_SLUG
    paths:
      - vendor/bundle
  before_script:
    - bundle config set --local path vendor/bundle

# Lint and Security cops only (see .rubocop.yml); the findings that existed when the job
# was added are frozen in .rubocop_todo.yml, so a new one fails the pipeline. The version
# is pinned so that a new RuboCop release cannot turn the job red on its own.
rubocop:
  stage: test
  image: ruby:3.3
  needs: []
  script:
    - gem install rubocop -v 1.92.0 --no-document
    - rubocop

typecheck:
  stage: test
  image: node:22
  needs: []
  script:
    - yarn install --frozen-lockfile
    # The generated client is not committed and the code imports it.
    - yarn codegen
    - yarn tsc --noEmit

# `test:coverage` runs `yarn codegen` first, then Vitest with the coverage floor of
# vitest.config.mts.
vitest:
  stage: test
  image: node:22
  needs: []
  script:
    - yarn install --frozen-lockfile
    - yarn test:coverage

# Runs in the ordinary branch pipeline, next to rspec, on every branch that is not
# the default one. No prefix allowlist: feat/, refactor/, docs/ and chore/ branches
# have already been merged here, and a prefix list silently exempts whatever it
# forgot. Deliberately NOT a merge_request_event job: a job limited to
# merge_request_event would create a merge request pipeline containing only itself,
# which would show up green on the MR while rspec (a branch pipeline job) could be red.
changelog:check:
  stage: test
  image: ruby:3.3
  variables:
    GIT_DEPTH: "0"
  rules:
    - if: '$CI_COMMIT_BRANCH && $CI_COMMIT_BRANCH != $CI_DEFAULT_BRANCH && $CI_PIPELINE_SOURCE != "merge_request_event"'
  script:
    # A branch pipeline does not bring master along, even with GIT_DEPTH: "0".
    - git fetch origin "+refs/heads/master:refs/remotes/origin/master"
    - ruby bin/changelog check --base origin/master
    # Needs every tag and the whole history, hence GIT_DEPTH: "0" above. It is
    # deliberately not in the release job: an editorial gap must not stop a
    # publication.
    - ruby bin/changelog coverage

# Reports known advisories on the JavaScript build dependencies (orval, esbuild, sass,
# typescript and what they pull in). Informational on purpose: a job failure shows as a
# warning and the pipeline goes on. Made blocking, a new advisory on a build-only
# dependency, often with no fixed version yet, would hold back every publication until
# someone upgrades it, and the path of least resistance would be to bypass the pipeline
# rather than respect it. Read its log when it turns orange. `yarn audit` reads
# package.json and yarn.lock only, so no install is needed, and `needs: []` lets it start
# at once. Nothing depends on it, canary and release included.
yarn:audit:
  stage: test
  image: node:22
  needs: []
  allow_failure: true
  script:
    - yarn audit --level high

build:
  stage: build
  image: node:22
  script:
    - yarn install --frozen-lockfile
    - mkdir -p app/assets/builds
    - yarn build:full
  artifacts:
    paths:
      - app/assets/builds/
    # Long enough that re-running a release job days later still finds them:
    # the release refuses to build a gem without compiled assets.
    expire_in: 1 week

# Builds the gem with the compiled assets of `build`, installs it into a throwaway
# directory and checks that every file the gem reads from its own tree at run time
# is in it. A file missing from spec.files fails nothing else: the code reading it
# rescues the error, and the feature goes silent for every user of the gem.
package:check:
  stage: package
  image: ruby:3.3
  needs: [build]
  script:
    - ruby script/check-gem-package

canary:
  stage: publish
  image: ruby:3.3
  # Written out rather than left to the stage order: a job with `needs` starts as
  # soon as the jobs it lists succeed, whatever its stage. Today `build` has no
  # `needs`, so it waits for the whole test stage and nothing publishes after a
  # red suite; giving `build` a `needs` one day would silently lift that.
  needs:
    - rspec
    - rspec:ruby3.4
    - rubocop
    - typecheck
    - vitest
    - build
    - package:check
  variables:
    GIT_DEPTH: "0"
  # Played by hand, never on push: a push to a branch is not reviewed, and this
  # job publishes a gem with the job token. allow_failure keeps an unplayed
  # canary from holding the pipeline (and the merge request) in a blocked state.
  rules:
    - if: '$CI_COMMIT_BRANCH =~ /^(feature|bugfix|hotfix|fix|breaking)\// && $CI_PIPELINE_SOURCE != "merge_request_event"'
      when: manual
      allow_failure: true
  script:
    - |
      set -e
      # bin/changelog counts the branch from master, which a branch pipeline does
      # not bring along.
      git fetch origin "+refs/heads/master:refs/remotes/origin/master"
      # Numbered after the version the branch will publish, not after the last
      # tag: a prerelease sorts before the release it is cut from.
      CANARY_VERSION=$(ruby script/canary-version "${CI_COMMIT_SHORT_SHA}")
      sed -i "s/VERSION = .*/VERSION = \"${CANARY_VERSION}\"/" lib/profiler/version.rb
      gem build profiler.gemspec
      mkdir -p ~/.gem && printf -- "---\n:gitlab: ${CI_JOB_TOKEN}\n" > ~/.gem/credentials && chmod 0600 ~/.gem/credentials
      gem push *.gem --key gitlab --host "${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/packages/rubygems" --verbose

release:
  stage: publish
  image: ruby:3.3
  # The same gate as canary, for the same reason.
  needs:
    - rspec
    - rspec:ruby3.4
    - rubocop
    - typecheck
    - vitest
    - build
    - package:check
  # One release at a time: the job tags the merged commit and pushes that tag.
  resource_group: release
  variables:
    GIT_DEPTH: "0"
  rules:
    - if: '$CI_COMMIT_BRANCH == "master" && $CI_COMMIT_TAG == null'
  script:
    - bash script/release.sh
