---
openapi: 3.0.1
info:
  title: Rails Profiler API
  version: v1
  description: Internal API for the Rails Profiler dashboard
paths:
  "/_profiler/api/console":
    get:
      summary: List console profiles
      description: Newest first, filtered and paged by the storage, has_more right at any offset.
        Each profile is a summary - no params, headers, bodies or tabs, and only the scalar values
        of each collector - the full profile is at the show endpoint.
      operationId: listConsoles
      tags:
      - Console
      parameters:
      - name: limit
        in: query
        required: false
        schema:
          type: integer
      - name: offset
        in: query
        required: false
        schema:
          type: integer
      responses:
        '200':
          description: console profiles list
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/ProfilesResponse"
  "/_profiler/api/console/{id}":
    parameters:
    - name: id
      in: path
      required: true
      schema:
        type: string
    get:
      summary: Get console profile details
      operationId: getConsole
      tags:
      - Console
      responses:
        '200':
          description: console profile found
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Profile"
        '404':
          description: console profile not found
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
    delete:
      summary: Delete a console profile
      operationId: deleteConsole
      tags:
      - Console
      responses:
        '204':
          description: console profile deleted
  "/_profiler/api/console/clear":
    delete:
      summary: Clear all console profiles
      operationId: clearConsoles
      tags:
      - Console
      responses:
        '204':
          description: console profiles cleared
  "/_profiler/api/env_vars":
    get:
      summary: Get current environment variables
      operationId: getEnvVars
      tags:
      - Env Vars
      responses:
        '200':
          description: env vars returned
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/EnvData"
    patch:
      summary: Set or delete an environment variable
      operationId: updateEnvVar
      tags:
      - Env Vars
      parameters: []
      responses:
        '200':
          description: variable updated
          content:
            application/json:
              schema:
                type: object
                properties:
                  key:
                    type: string
                  value:
                    type: string
                    nullable: true
                  override:
                    "$ref": "#/components/schemas/EnvOverride"
                    nullable: true
        '422':
          description: key is blank
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required:
              - key
              properties:
                key:
                  type: string
                value:
                  type: string
                  nullable: true
  "/_profiler/api/env_vars/reset":
    delete:
      summary: Reset a single env var override
      operationId: resetEnvVar
      tags:
      - Env Vars
      parameters:
      - name: key
        in: query
        required: true
        schema:
          type: string
      responses:
        '200':
          description: override reset
          content:
            application/json:
              schema:
                type: object
                properties:
                  key:
                    type: string
                  value:
                    type: string
                    nullable: true
                  reset:
                    type: boolean
  "/_profiler/api/env_vars/reset_all":
    delete:
      summary: Reset all env var overrides
      operationId: resetAllEnvVars
      tags:
      - Env Vars
      responses:
        '200':
          description: all overrides reset
          content:
            application/json:
              schema:
                type: object
                properties:
                  reset:
                    type: boolean
  "/_profiler/api/explain":
    post:
      summary: Run EXPLAIN ANALYZE on a stored query
      operationId: explainQuery
      tags:
      - Database
      parameters: []
      responses:
        '200':
          description: explain result
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/ExplainResult"
        '422':
          description: invalid request, or a query that is not read-only (only SELECT,
            WITH ... SELECT, TABLE and VALUES are explained)
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required:
              - token
              - query_index
              properties:
                token:
                  type: string
                  description: Profile token
                query_index:
                  type: integer
                  description: Index of the query in collectors_data.database.queries
  "/_profiler/api/function_profiling":
    get:
      summary: Get function profiling configuration
      operationId: getFunctionProfiling
      tags:
      - Function Profiling
      responses:
        '200':
          description: function profiling config
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/FunctionProfilingConfig"
    patch:
      summary: Update function profiling configuration
      operationId: updateFunctionProfiling
      tags:
      - Function Profiling
      parameters: []
      responses:
        '200':
          description: config updated
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/FunctionProfilingConfig"
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                enabled:
                  type: boolean
                max_frames:
                  type: integer
                mode:
                  type: string
                  enum:
                  - full
                  - lite
                clock:
                  type: string
                  enum:
                  - wall
                  - cpu
                  - object
  "/_profiler/api/jobs":
    get:
      summary: List job profiles
      description: Newest first, filtered and paged by the storage, has_more right at any offset.
        Each profile is a summary - no params, headers, bodies or tabs, and only the scalar values
        of each collector - the full profile is at the show endpoint.
      operationId: listJobs
      tags:
      - Jobs
      parameters:
      - name: limit
        in: query
        required: false
        schema:
          type: integer
      - name: offset
        in: query
        required: false
        schema:
          type: integer
      responses:
        '200':
          description: jobs list
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/ProfilesResponse"
  "/_profiler/api/jobs/{id}":
    parameters:
    - name: id
      in: path
      required: true
      schema:
        type: string
    get:
      summary: Get job profile details
      operationId: getJob
      tags:
      - Jobs
      responses:
        '200':
          description: job profile found
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Profile"
        '404':
          description: job profile not found
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
    delete:
      summary: Delete a job profile
      operationId: deleteJob
      tags:
      - Jobs
      responses:
        '204':
          description: job profile deleted
  "/_profiler/api/jobs/clear":
    delete:
      summary: Clear all job profiles
      operationId: clearJobs
      tags:
      - Jobs
      responses:
        '204':
          description: job profiles cleared
  "/_profiler/api/outbound_http":
    get:
      summary: List all outbound HTTP requests across profiles
      operationId: listOutboundRequests
      tags:
      - Outbound HTTP
      responses:
        '200':
          description: outbound requests list
          content:
            application/json:
              schema:
                type: array
                items:
                  "$ref": "#/components/schemas/OutboundRequest"
  "/_profiler/api/profiles":
    get:
      summary: List HTTP profiles
      description: Newest first, filtered and paged by the storage, has_more right at any offset.
        Each profile is a summary - no params, headers, bodies or tabs, and only the scalar values
        of each collector - the full profile is at the show endpoint.
      operationId: listProfiles
      tags:
      - Profiles
      parameters:
      - name: limit
        in: query
        required: false
        schema:
          type: integer
      - name: offset
        in: query
        required: false
        schema:
          type: integer
      responses:
        '200':
          description: profiles list
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/ProfilesResponse"
  "/_profiler/api/profiles/{id}":
    parameters:
    - name: id
      in: path
      required: true
      schema:
        type: string
    get:
      summary: Get profile details
      operationId: getProfile
      tags:
      - Profiles
      responses:
        '200':
          description: profile found
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Profile"
        '404':
          description: profile not found
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
    delete:
      summary: Delete a profile
      operationId: deleteProfile
      tags:
      - Profiles
      responses:
        '204':
          description: profile deleted
  "/_profiler/api/profiles/clear":
    delete:
      summary: Clear all HTTP profiles
      operationId: clearProfiles
      tags:
      - Profiles
      responses:
        '204':
          description: profiles cleared
  "/_profiler/api/test_runner/files":
    get:
      summary: List test files and frameworks
      operationId: getTestRunnerFiles
      tags:
      - Test Runner
      parameters:
      - name: framework
        in: query
        required: false
        schema:
          type: string
      responses:
        '200':
          description: test files tree
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/TestRunnerFilesResponse"
  "/_profiler/api/test_runner/runs":
    post:
      summary: Start a test run
      operationId: createTestRun
      tags:
      - Test Runner
      parameters: []
      responses:
        '422':
          description: no files selected
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required:
              - files
              properties:
                files:
                  type: array
                  items:
                    type: string
                framework:
                  type: string
  "/_profiler/api/test_runner/runs/{id}":
    parameters:
    - name: id
      in: path
      required: true
      schema:
        type: string
    get:
      summary: Get test run status
      operationId: getTestRun
      tags:
      - Test Runner
      responses:
        '404':
          description: run not found
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
    delete:
      summary: Kill a test run
      operationId: deleteTestRun
      tags:
      - Test Runner
      responses:
        '404':
          description: run not found
  "/_profiler/api/tests":
    get:
      summary: List test profiles
      description: Newest first, filtered and paged by the storage, has_more right at any offset.
        Each profile is a summary - no params, headers, bodies or tabs, and only the scalar values
        of each collector - the full profile is at the show endpoint.
      operationId: listTests
      tags:
      - Tests
      parameters:
      - name: limit
        in: query
        required: false
        schema:
          type: integer
      - name: offset
        in: query
        required: false
        schema:
          type: integer
      responses:
        '200':
          description: test profiles list
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/ProfilesResponse"
  "/_profiler/api/tests/{id}":
    parameters:
    - name: id
      in: path
      required: true
      schema:
        type: string
    get:
      summary: Get test profile details
      operationId: getTest
      tags:
      - Tests
      responses:
        '200':
          description: test profile found
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Profile"
        '404':
          description: test profile not found
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
    delete:
      summary: Delete a test profile
      operationId: deleteTest
      tags:
      - Tests
      responses:
        '204':
          description: test profile deleted
  "/_profiler/api/tests/clear":
    delete:
      summary: Clear all test profiles
      operationId: clearTests
      tags:
      - Tests
      responses:
        '204':
          description: test profiles cleared
  "/_profiler/api/toolbar/{token}":
    parameters:
    - name: token
      in: path
      required: true
      schema:
        type: string
    get:
      summary: Get toolbar data for a profile
      operationId: getToolbar
      tags:
      - Toolbar
      responses:
        '200':
          description: toolbar data
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/ToolbarResponse"
        '404':
          description: profile not found
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
components:
  schemas:
    ProfilesResponse:
      type: object
      required:
      - profiles
      - limit
      - offset
      - has_more
      properties:
        profiles:
          type: array
          items:
            "$ref": "#/components/schemas/Profile"
        limit:
          type: integer
        offset:
          type: integer
        has_more:
          type: boolean
    Profile:
      type: object
      required:
      - token
      - method
      - path
      - status
      - duration
      - started_at
      properties:
        token:
          type: string
        method:
          type: string
        path:
          type: string
        status:
          type: integer
        duration:
          type: number
          format: float
        allocated_objects:
          type: integer
          nullable: true
          description: Objects allocated during the request, job, command or test. The counter
            is the process's, so on a multi-threaded server it includes what other threads
            allocated meanwhile.
        memory:
          type: integer
          nullable: true
          deprecated: true
          description: allocated_objects times 40. Never a measured byte count; kept for older
            readers, use allocated_objects.
        started_at:
          type: string
          format: date-time
        profile_type:
          type: string
          enum:
          - http
          - job
          - test
          nullable: true
        gem_version:
          type: string
          nullable: true
        parent_token:
          type: string
          nullable: true
        child_jobs:
          type: array
          items:
            "$ref": "#/components/schemas/ChildJobSummary"
          nullable: true
        parent_profile:
          "$ref": "#/components/schemas/ParentProfileSummary"
          nullable: true
        params:
          type: object
          additionalProperties: true
          nullable: true
        headers:
          type: object
          additionalProperties: true
          nullable: true
        response_headers:
          type: object
          additionalProperties: true
          nullable: true
        request_body:
          type: string
          nullable: true
        request_body_encoding:
          type: string
          enum:
          - text
          - base64
          nullable: true
        response_body:
          type: string
          nullable: true
        response_body_encoding:
          type: string
          enum:
          - text
          - base64
          nullable: true
        request_body_size:
          type: integer
          nullable: true
          description: Size in bytes of the whole request body, when it was cut at max_captured_body_bytes.
        request_body_truncated:
          type: boolean
          nullable: true
          description: Whether only the first max_captured_body_bytes of the request body were kept.
        request_body_size_is_minimum:
          type: boolean
          nullable: true
          description: Whether request_body_size is only a minimum (no Content-Length).
        response_body_size:
          type: integer
          nullable: true
          description: Size in bytes of the whole response body seen by the profiler.
        response_body_size_is_minimum:
          type: boolean
          nullable: true
          description: Whether response_body_size is only a minimum (a stream that stopped before its end).
        collectors_released_after_seconds:
          type: integer
          nullable: true
          description: Set when the collectors of a streamed response were released this many
            seconds after the application returned, before the server closed the body; what the
            stream did after that is missing from the profile.
        response_body_truncated:
          type: boolean
          nullable: true
          description: Whether only the first max_captured_body_bytes of the response body were kept.
        collectors_data:
          "$ref": "#/components/schemas/CollectorsData"
          nullable: true
        tabs:
          type: array
          items:
            "$ref": "#/components/schemas/TabConfig"
          nullable: true
    CollectorsData:
      type: object
      properties:
        database:
          "$ref": "#/components/schemas/DatabaseData"
        cache:
          "$ref": "#/components/schemas/CacheData"
        dump:
          "$ref": "#/components/schemas/DumpData"
        request:
          "$ref": "#/components/schemas/RequestData"
        performance:
          "$ref": "#/components/schemas/PerformanceData"
        view:
          "$ref": "#/components/schemas/ViewData"
        ajax:
          "$ref": "#/components/schemas/AjaxData"
        http:
          "$ref": "#/components/schemas/HttpData"
        job:
          "$ref": "#/components/schemas/JobData"
        flamegraph:
          "$ref": "#/components/schemas/FlameGraphData"
        logs:
          "$ref": "#/components/schemas/LogData"
        exception:
          "$ref": "#/components/schemas/ExceptionData"
        routes:
          "$ref": "#/components/schemas/RoutesData"
        i18n:
          "$ref": "#/components/schemas/I18nData"
        env:
          "$ref": "#/components/schemas/EnvData"
        mailer:
          "$ref": "#/components/schemas/MailerData"
      additionalProperties: true
    DatabaseData:
      type: object
      required:
      - total_queries
      - total_duration
      - slow_queries
      - cached_queries
      - queries
      properties:
        total_queries:
          type: integer
        total_duration:
          type: number
          format: float
        slow_queries:
          type: integer
        cached_queries:
          type: integer
        queries:
          type: array
          items:
            "$ref": "#/components/schemas/DatabaseQuery"
    DatabaseQuery:
      type: object
      required:
      - sql
      - duration
      - slow
      - cached
      properties:
        sql:
          type: string
        duration:
          type: number
          format: float
        slow:
          type: boolean
        cached:
          type: boolean
        transaction:
          type: boolean
          nullable: true
        name:
          type: string
          nullable: true
        binds:
          type: array
          items: {}
          nullable: true
        backtrace:
          type: array
          items:
            type: string
          nullable: true
    CacheData:
      type: object
      required:
      - total_reads
      - total_writes
      - total_deletes
      - hit_rate
      - hits
      - misses
      properties:
        total_reads:
          type: integer
        total_writes:
          type: integer
        total_deletes:
          type: integer
        hit_rate:
          type: number
          format: float
        hits:
          type: integer
        misses:
          type: integer
        reads:
          type: array
          items:
            "$ref": "#/components/schemas/CacheOperation"
          nullable: true
        writes:
          type: array
          items:
            "$ref": "#/components/schemas/CacheOperation"
          nullable: true
        deletes:
          type: array
          items:
            "$ref": "#/components/schemas/CacheOperation"
          nullable: true
    CacheOperation:
      type: object
      required:
      - key
      - duration
      properties:
        key:
          type: string
        duration:
          type: number
          format: float
        hit:
          type: boolean
          nullable: true
    DumpData:
      type: object
      required:
      - count
      - dumps
      properties:
        count:
          type: integer
        dumps:
          type: array
          items:
            "$ref": "#/components/schemas/Dump"
    Dump:
      type: object
      required:
      - file
      - line
      - timestamp
      - formatted
      properties:
        label:
          type: string
          nullable: true
        file:
          type: string
        line:
          type: integer
        timestamp:
          type: string
        formatted:
          type: string
    RequestData:
      type: object
      required:
      - headers
      - params
      properties:
        headers:
          type: object
          additionalProperties: true
        params:
          type: object
          additionalProperties: true
        response_headers:
          type: object
          additionalProperties: true
          nullable: true
        request_body:
          type: string
          nullable: true
        request_body_encoding:
          type: string
          enum:
          - text
          - base64
          nullable: true
        response_body:
          type: string
          nullable: true
        response_body_encoding:
          type: string
          enum:
          - text
          - base64
          nullable: true
        request_body_size:
          type: integer
          nullable: true
          description: Size in bytes of the whole request body, when it was cut at max_captured_body_bytes.
        request_body_truncated:
          type: boolean
          nullable: true
          description: Whether only the first max_captured_body_bytes of the request body were kept.
        request_body_size_is_minimum:
          type: boolean
          nullable: true
          description: Whether request_body_size is only a minimum (no Content-Length).
        response_body_size:
          type: integer
          nullable: true
          description: Size in bytes of the whole response body seen by the profiler.
        response_body_size_is_minimum:
          type: boolean
          nullable: true
          description: Whether response_body_size is only a minimum (a stream that stopped before its end).
        collectors_released_after_seconds:
          type: integer
          nullable: true
          description: Set when the collectors of a streamed response were released this many
            seconds after the application returned, before the server closed the body; what the
            stream did after that is missing from the profile.
        response_body_truncated:
          type: boolean
          nullable: true
          description: Whether only the first max_captured_body_bytes of the response body were kept.
        route_name:
          type: string
          nullable: true
        route_pattern:
          type: string
          nullable: true
        route_params:
          type: object
          additionalProperties: true
          nullable: true
        controller_action:
          type: string
          nullable: true
    PerformanceData:
      type: object
      required:
      - total_events
      - total_duration
      - events
      properties:
        total_events:
          type: integer
        total_duration:
          type: number
          format: float
        events:
          type: array
          items:
            "$ref": "#/components/schemas/PerformanceEvent"
    PerformanceEvent:
      type: object
      required:
      - name
      - duration
      properties:
        name:
          type: string
        duration:
          type: number
          format: float
        payload:
          type: object
          additionalProperties: true
          nullable: true
    ViewData:
      type: object
      required:
      - total_views
      - total_partials
      - total_duration
      properties:
        total_views:
          type: integer
        total_partials:
          type: integer
        total_duration:
          type: number
          format: float
        views:
          type: array
          items:
            "$ref": "#/components/schemas/ViewRender"
          nullable: true
        partials:
          type: array
          items:
            "$ref": "#/components/schemas/ViewRender"
          nullable: true
    ViewRender:
      type: object
      required:
      - identifier
      - duration
      properties:
        identifier:
          type: string
        duration:
          type: number
          format: float
    AjaxData:
      type: object
      required:
      - total_requests
      - total_duration
      - by_method
      - by_status
      - requests
      properties:
        total_requests:
          type: integer
        total_duration:
          type: number
          format: float
        by_method:
          type: object
          additionalProperties:
            type: integer
        by_status:
          type: object
          additionalProperties:
            type: integer
        requests:
          type: array
          items:
            "$ref": "#/components/schemas/AjaxRequest"
    AjaxRequest:
      type: object
      required:
      - token
      - path
      - method
      - status
      - duration
      - started_at
      properties:
        token:
          type: string
        path:
          type: string
        method:
          type: string
        status:
          type: integer
        duration:
          type: number
          format: float
        started_at:
          type: string
          format: date-time
    HttpData:
      type: object
      required:
      - total_requests
      - total_duration
      - slow_requests
      - error_requests
      - by_host
      - by_status
      - requests
      properties:
        total_requests:
